name: mpi4py (ASAN)

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # We need Ubuntu 24.04 (over 22.04) due to a kernel bug,
    # see https://github.com/google/sanitizers/issues/856.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MPI4PY_TEST_SPAWN: true
      # disable ASAN while building
      ASAN_OPTIONS: 
        verify_asan_link_order=0,detect_odr_violation=0,abort_on_error=0
      # disable leak detection
      LSAN_OPTIONS: detect_leaks=0,exitcode=0

    steps:
    - name: Configure hostname
      run: |-
        echo 127.0.0.1 `hostname` | sudo tee -a /etc/hosts > /dev/null
      if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}

    - name: Install dependencies
      run: |-
        sudo apt-get install -y -q libnuma-dev libasan8
      if: ${{ runner.os == 'Linux' }}

    - name: Checkout Open MPI
      uses: actions/checkout@v6
      with:
        path: mpi-build
        submodules: recursive

        ref: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'd28dc7ca7813cd9340c728d23181ad364fe57de1' || 
          github.sha }}
    - name: Bootstrap Open MPI
      run: |-
        AUTOMAKE_JOBS=$(nproc) ./autogen.pl
      working-directory: mpi-build

    # Install into a separate directory (/opt/openmpi) so that we can
    # bundle up that tree into an artifact to share with other jobs in
    # this github action.  Specifically don't use /usr/local, because
    # there's a bunch of other stuff already installed in /usr/local,
    # and we don't need to include that in our artifact.
    - name: Configure Open MPI
      run: |-
        ./configure --enable-debug --disable-dependency-tracking --disable-sphinx --disable-mpi-fortran --disable-oshmem --disable-silent-rules --prefix=/opt/openmpi CFLAGS="-O1 -fno-omit-frame-pointer -g -fsanitize=address" LDFLAGS="-Wl,-rpath,/opt/openmpi/lib -fsanitize=address"
      working-directory: mpi-build

    - name: Build MPI
      run: |-
        make -j $(nproc)
      working-directory: mpi-build

    - name: Install MPI
      run: |-
        sudo make install
      working-directory: mpi-build

    - name: Add Open MPI to PATH
      run: |-
        echo /opt/openmpi/bin >> $GITHUB_PATH


    - name: Tweak MPI
      run: |
        # Tweak MPI
        mca_params="$HOME/.openmpi/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo mpi_param_check = true >> "$mca_params"
        echo mpi_show_handle_leaks = true >> "$mca_params"
        mca_params="$HOME/.prte/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo rmaps_default_mapping_policy = :oversubscribe >> "$mca_params"
        #
        # Recent versions of OpenPMIx started emitting warnings about use of deprecated
        # MCA parameters its emission to stderr causes the demo/test-run stuff below to fail.
        # Suppress generation of these warnings.  A simpler CI test should be used to
        # to check for these messages.
        #
        mca_params="$HOME/.pmix/mca-params.conf"
        mkdir -p "$(dirname "$mca_params")"
        echo mca_base_suppress_deprecated_warning = true >> "$mca_params"

    - name: Use Python
      uses: actions/setup-python@v5
      with:
        python-version: 3
        architecture: x64

    - name: Install Python packages (build)
      run: |-
        python -m pip install --upgrade setuptools pip wheel


    - name: Install Python packages (test)
      run: |-
        python -m pip install --upgrade numpy cffi pyyaml


    - name: Checkout mpi4py
      uses: actions/checkout@v6
      with:
        repository: mpi4py/mpi4py
        ref: master

    - name: Setting up ASAN environment
      # LD_PRELOAD is needed to make sure ASAN is the first thing loaded
      # as it will otherwise complain.
      # Leak detection is currently disabled because of the size of the report.
      # The patcher is disabled because ASAN fails if code mmaps data at fixed
      # memory addresses, see https://github.com/open-mpi/ompi/issues/12819.
      # ODR violation detection is disabled until #13469 is fixed.
      run: |
        echo LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libasan.so.8 >> $GITHUB_ENV
        echo ASAN_OPTIONS=detect_odr_violation=0,abort_on_error=1,detect_stack_use_after_return=1 >> $GITHUB_ENV
        echo LSAN_OPTIONS=detect_leaks=0,exitcode=0 >> $GITHUB_ENV
        echo OMPI_MCA_memory=^patcher >> $GITHUB_ENV

    - name: Show MPI
      run: |-
        ompi_info --all --all


    - name: Install mpi4py
      run: |-
        python -m pip install .
      env:
        CFLAGS: "-O0"

    - name: Test mpi4py (singleton)
      run: |-
        python test/main.py -v -x TestExcErrhandlerNull
      if: ${{ true }}
      timeout-minutes: 10

    - name: Test mpi4py (np=1)
      run: |-
        mpiexec -n 1 python test/main.py -v -x TestExcErrhandlerNull
      if: ${{ true }}
      timeout-minutes: 10

    - name: Test mpi4py (np=4)
      run: |-
        mpiexec -n 4 python test/main.py -v -f -x TestExcErrhandlerNull
      if: ${{ true }}
      timeout-minutes: 10
    needs:
    - alpha_bridge_inputs
    if: |-
      ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
  alpha_bridge_inputs:
    name: CI input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-1311dbae2619cd35-${{ github.workflow }}-${{ 
        github.sha }}-${{ github.event.schedule || github.event_name }}
      cancel-in-progress: false
      queue: max
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || github.event_name 
          == 'workflow_run') && 'd28dc7ca7813cd9340c728d23181ad364fe57de1' || 
          github.sha }}
        AB_REF: ${{ (github.event_name == 'schedule' || github.event_name == 
          'workflow_run') && 'refs/heads/main' || github.ref }}
        AB_WORKFLOW_DIGEST: 
          fb3206d3aaedbb94c5380bc8c7a64ecb7166fb1ac67a02dbeb79459b48905cf0
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
        AB_DEFAULT_PERMISSIONS: read
        AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport base64\nimport hashlib\nimport json\nimport os\nimport
        re\nimport urllib.parse\nimport urllib.request\n\nINPUT_CHECK_NAMES = (\"\
        CI input check\", \"AlphaBridge input check\")\nINPUT_IDENTITY_PREFIXES =
        (\"CI input identity \", \"AlphaBridge input identity \")\n\n\ndef is_input_check(job):\n\
        \    \"\"\"GitHub prefixes callable job names with each caller's display name.\"\
        \"\"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in INPUT_CHECK_NAMES\n\
        \n\ndef input_identity(job):\n    for step in job.get(\"steps\", []):\n  \
        \      if step.get(\"conclusion\") != \"success\":\n            continue\n\
        \        name = step.get(\"name\", \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n\
        \            if name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
        \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n         \
        \           return identity\n    return \"\"\n\n\ndef parent_has_work(get,
        repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
        head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"status\") !=
        \"completed\"\n    ):\n        return True\n    sha = parent[\"head_sha\"\
        ]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha) is None:\n        raise ValueError(\"\
        parent workflow has no exact configuration commit\")\n    record = get(f\"\
        /repos/{repository}\")\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
        )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"]))\n \
        \   if (\n        record.get(\"fork\") is not True\n        or marker.get(\"\
        schema\") != \"alpha-bridge/fork-ci\"\n        or marker.get(\"source_repository\"\
        ) != record.get(\"parent\", {}).get(\"full_name\")\n    ):\n        raise
        ValueError(\"parent CI configuration has no verified fork ownership\")\n \
        \   path = parent[\"path\"].split(\"@\", 1)[0]\n    if not path.startswith(\"\
        .github/workflows/\") or \"/\" in path.removeprefix(\".github/workflows/\"\
        ):\n        raise ValueError(\"parent workflow path is outside its configuration
        owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
        safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
        content\"])).hexdigest() != marker.get(\n        \"definition_sha256\", {}\n\
        \    ).get(path):\n        raise ValueError(\"parent workflow differs from
        its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
        :\n        return False\n    jobs = []\n    page = 1\n    while True:\n  \
        \      values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
        \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
        < 100:\n            break\n        page += 1\n    guards = [\n        job\n\
        \        for job in jobs\n        if is_input_check(job) and job.get(\"conclusion\"\
        ) == \"success\" and input_identity(job)\n    ]\n    return not guards or
        any(\n        job not in guards and job.get(\"conclusion\") != \"skipped\"\
        \ for job in jobs\n    )\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    page = 1\n    while True:\n       \
        \ # Filter locally: GitHub caps filtered searches at 1,000 results.\n    \
        \    query = urllib.parse.urlencode({\"per_page\": 100, \"page\": page})\n\
        \        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"id\"\
        ] == run_id:\n                continue\n            if run.get(\"head_branch\"\
        ) != current[\"head_branch\"] or run.get(\"event\") != event:\n          \
        \      continue\n            job_page = 1\n            while True:\n     \
        \           jobs = get(\n                    f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
        \n                )[\"jobs\"]\n                for job in jobs:\n        \
        \            if (\n                        (\n                           \
        \ is_input_check(job)\n                            if job_name in INPUT_CHECK_NAMES\n\
        \                            else job[\"name\"] == job_name\n            \
        \            )\n                        and job.get(\"status\") == \"completed\"\
        \n                        and job.get(\"conclusion\") == \"success\"\n   \
        \                     and input_identity(job) == identity\n              \
        \      ):\n                        return False\n                if len(jobs)
        < 100:\n                    break\n                job_page += 1\n       \
        \ if len(runs[\"workflow_runs\"]) < 100:\n            return True\n      \
        \  page += 1\n\n\ndef main():\n    event = os.environ[\"AB_EVENT\"]\n    event_payload
        = None\n    if event not in {\"schedule\", \"workflow_run\"}:\n        with
        open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\") as payload_file:\n\
        \            event_payload = json.load(payload_file)\n    inputs = {\n   \
        \     \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n        \"source_ref\"\
        : os.environ[\"AB_REF\"],\n        \"workflow_definition\": os.environ[\"\
        AB_WORKFLOW_DIGEST\"],\n        \"event\": event,\n        \"event_payload\"\
        : event_payload,\n        \"schedule\": os.environ[\"AB_SCHEDULE\"],\n   \
        \     \"variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n        \"\
        inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"default_workflow_permissions\"\
        : os.environ[\"AB_DEFAULT_PERMISSIONS\"],\n        \"runner_image\": [os.environ.get(\"\
        ImageOS\", \"\"), os.environ.get(\"ImageVersion\", \"\")],\n        \"producer\"\
        : json.loads(os.environ.get(\"AB_WORKFLOW_RUN\", \"null\")),\n    }\n    identity
        = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    manual = event == \"workflow_dispatch\"\
        \ or int(os.environ[\"GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual
        or (\n        (\n            inputs[\"event\"] != \"workflow_run\"\n     \
        \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"producer\"\
        ])\n        )\n        and changed(\n            get,\n            repository=os.environ[\"\
        AB_REPOSITORY\"],\n            run_id=int(os.environ[\"AB_RUN_ID\"]),\n  \
        \          identity=identity,\n            job_name=\"CI input check\",\n\
        \        )\n    )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"\
        utf-8\") as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\n        \"Explicit CI run requested\"\n        if manual\n\
        \        else \"CI inputs changed\"\n        if should_run\n        else \"\
        CI inputs unchanged; build and test jobs skipped\"\n    )\n\n\nif __name__
        == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
    - name: CI input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
