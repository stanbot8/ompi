# The idea behind this Action is to prevent the situation where a user
# files a Github Issue, someone asks for clarification / more
# information, but the original poster never provides the information.
# The issue then becomes forgotten and abondoned.
#
# Instead of that scenario, Open MPI community members can assign a
# label to Github Issues indicating that we're waiting for the user to
# reply.  If too much time elapses with no reply, mark the Issue as
# stale and emit a warning that we'll close the issue if we continue
# to receive no reply.  If we timeout again with no reply after the
# warning, close the Issue and emit a comment explaining why.
#
# If the user *does* reply, the label is removed, and this bot won't
# touch the Issue.  Specifically: this bot will never mark stale /
# close an Issue that doesn't have the specified label.
#
# Additionally, we are *only* marking stale / auto-closing Github
# Issues -- not Pull Requests.
#
# This is a cron-based Action that runs a few times a day, just so
# that we don't mark stale / close a bunch of issues all at once.
#
# While the actions/stale bot Action used here is capable of removing
# the label when a user replies to the Issue, we actually use a 2nd
# Action (removing-awaiting-user-info-label.yaml) to remove the label.
# We do this because that 2nd Action runs whenever a comment is
# created -- not via cron.  Hence, the 2nd Action will remove the
# label effectively immediately when the user replies (vs. up to
# several hours later).

name: Close stale issues
on:
  schedule:
    # Run it a few times a day so as not to necessarily mark stale /
    # close a bunch of issues at once.
  - cron: 0 1,5,9,13,17,21 * * *

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # https://github.com/marketplace/actions/close-stale-issues
    - uses: actions/stale@v9
      with:
          # If there are no replies for 14 days, mark the issue as
          # "stale" (and emit a warning).
        days-before-stale: 14
          # If there are no replies for 14 days after becoming stale,
          # then close the issue (and emit a message explaining why).
        days-before-close: 14

          # Never close PRs
        days-before-pr-close: -1

          # We only close issues with this label
        only-labels: State-Awaiting user information
        close-issue-label: Closed due to no reply

          # Messages that we put in comments on issues
        stale-issue-message: |
          It looks like this issue is expecting a response, but hasn't gotten one yet.  If there are no responses in the next 2 weeks, we'll assume that the issue has been abandoned and will close it.
        close-issue-message: |
          Per the above comment, it has been a month with no reply on this issue.  It looks like this issue has been abandoned.

          I'm going to close this issue.  If I'm wrong and this issue is *not* abandoned, please feel free to re-open it.  Thank you!
    needs:
    - alpha_bridge_inputs
    if: ${{ (success()) && needs.alpha_bridge_inputs.outputs.changed == 'true' 
      }}
  alpha_bridge_inputs:
    name: AlphaBridge input check
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    concurrency:
      group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha }}-${{ 
        github.event.schedule || github.event_name }}
      cancel-in-progress: false
    outputs:
      changed: ${{ steps.identity.outputs.changed }}
    steps:
    - id: identity
      name: Check source, workflow, variables, and runner inputs
      env:
        GH_TOKEN: ${{ github.token }}
        AB_REPOSITORY: ${{ github.repository }}
        AB_RUN_ID: ${{ github.run_id }}
        AB_HEAD_SHA: 9bf19af46b93024cbe662aa63c5d9d53cb259672
        AB_WORKFLOW_DIGEST: 
          315e3122c576e300bdc6e5e2f3c680a452e262581a391fbfa64bc55a8f2e339b
        AB_EVENT: ${{ github.event_name }}
        AB_SCHEDULE: ${{ github.event.schedule || '' }}
        AB_VARIABLES: ${{ toJSON(vars) }}
        AB_INPUTS: ${{ toJSON(inputs) }}
      shell: bash
      run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native scheduled-CI input check,
        embedded in the owned fork configuration.\"\"\"\n\nfrom __future__ import
        annotations\n\nimport hashlib\nimport json\nimport os\nimport urllib.parse\n\
        import urllib.request\n\n\ndef changed(get, *, repository, run_id, identity,
        job_name):\n    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
        )\n    event = current[\"event\"]\n    query = urllib.parse.urlencode(\n \
        \       {\n            \"branch\": current[\"head_branch\"],\n           \
        \ \"event\": event,\n            \"per_page\": 100,\n        }\n    )\n  \
        \  runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
        )\n    for run in runs[\"workflow_runs\"]:\n        if run[\"id\"] == run_id:\n\
        \            continue\n        if run.get(\"head_branch\") != current[\"head_branch\"\
        ] or run.get(\"event\") != event:\n            raise ValueError(\"provider
        returned a different CI input identity\")\n        page = 1\n        while
        True:\n            jobs = get(\n                f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={page}\"\
        \n            )[\"jobs\"]\n            for job in jobs:\n                if
        (\n                    job[\"name\"] == job_name\n                    and
        job.get(\"status\") == \"completed\"\n                    and job.get(\"conclusion\"\
        ) == \"success\"\n                    and any(\n                        step[\"\
        name\"] == f\"AlphaBridge input identity {identity}\"\n                  \
        \      and step.get(\"conclusion\") == \"success\"\n                     \
        \   for step in job.get(\"steps\", [])\n                    )\n          \
        \      ):\n                    return False\n            if len(jobs) < 100:\n\
        \                break\n            page += 1\n    return True\n\n\ndef main():\n\
        \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"],\n\
        \        \"workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n  \
        \      \"event\": os.environ[\"AB_EVENT\"],\n        \"schedule\": os.environ[\"\
        AB_SCHEDULE\"],\n        \"variables\": json.loads(os.environ[\"AB_VARIABLES\"\
        ]),\n        \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
        runner_image\": [os.environ.get(\"ImageOS\", \"\"), os.environ.get(\"ImageVersion\"\
        , \"\")],\n    }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
        \n    def get(path):\n        request = urllib.request.Request(\n        \
        \    \"https://api.github.com\" + path,\n            headers={\n         \
        \       \"Authorization\": \"Bearer \" + os.environ[\"GH_TOKEN\"],\n     \
        \           \"Accept\": \"application/vnd.github+json\",\n               \
        \ \"X-GitHub-Api-Version\": \"2026-03-10\",\n            },\n        )\n \
        \       with urllib.request.urlopen(request, timeout=60) as response:\n  \
        \          return json.load(response)\n\n    should_run = inputs[\"event\"\
        ] != \"schedule\" or changed(\n        get,\n        repository=os.environ[\"\
        AB_REPOSITORY\"],\n        run_id=int(os.environ[\"AB_RUN_ID\"]),\n      \
        \  identity=identity,\n        job_name=\"AlphaBridge input check\",\n   \
        \ )\n    with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
        ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
        n\")\n    print(\"CI inputs changed\" if should_run else \"CI inputs unchanged;
        build and test jobs skipped\")\n\n\nif __name__ == \"__main__\":\n    main()\n\
        \nALPHA_BRIDGE_CI_PY\n"
    - name: AlphaBridge input identity ${{ steps.identity.outputs.digest }}
      run: echo 'Input identity recorded'
