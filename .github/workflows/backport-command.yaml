# Slash-command handler for /backport.
#
# Posting a comment on a merged PR with:
#
#   /backport v5.0.x v4.1.x
#
# is equivalent to manually triggering the "Backport" workflow from the
# GitHub Actions UI with those branch names.  Multiple branches may be
# supplied as space- or comma-separated values on the same line.
#
# Only repository owners, organisation members, and collaborators may trigger
# the command.  If an unauthorised user attempts /backport, the bot replies
# with an explanatory comment.  For valid commands it acknowledges with a 👀
# reaction; invalid or unrecognised commands get a usage hint as a comment.

name: Backport slash command

on:
    issue_comment:
        types: [created]

permissions: {}

jobs:
    dispatch:
        name: Handle /backport comment
        runs-on: ubuntu-latest
        # Only act on PR comments (issue_comment fires for both issues and PRs).
        if: |-
            ${{ (github.event.issue.pull_request != null) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
        permissions:
            actions: write       # trigger workflow_dispatch
            issues: write        # post comments
        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Parse command and validate PR
              id: parse
              uses: actions/github-script@v8
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const body        = context.payload.comment.body;
                      const commentId   = context.payload.comment.id;
                      const issueNumber = context.payload.issue.number;
                      const login       = context.payload.comment.user.login;

                      // Best-effort comment helper — if Issues are disabled on
                      // the repo (common for forks) the call returns 403 and we
                      // log a warning rather than aborting the workflow.
                      async function tryComment(text) {
                          try {
                              await github.rest.issues.createComment({
                                  owner:        context.repo.owner,
                                  repo:         context.repo.repo,
                                  issue_number: issueNumber,
                                  body:         text,
                              });
                          } catch (err) {
                              core.warning(`Could not post comment: ${err.message}`);
                          }
                      }

                      // Detect a bare /backport with no arguments and reply helpfully.
                      const bareMatch = /^\/backport\s*$/m.test(body);
                      // Look for /backport with arguments at the start of any line.
                      const match = body.match(/^\/backport\s+([^\r\n]+)/m);

                      // If the comment doesn't contain any /backport command at all,
                      // do nothing — no need to check permissions.
                      if (!bareMatch && !match) {
                          core.setOutput('triggered', 'false');
                          return;
                      }

                      // Use author_association from the webhook payload — no extra
                      // API call required. getCollaboratorPermissionLevel requires
                      // org-level "Members" read permission, which is not available
                      // to either GITHUB_TOKEN or a GitHub App without explicit
                      // org-level permission grants.
                      const assoc = context.payload.comment.author_association;
                      if (!['OWNER', 'MEMBER', 'COLLABORATOR'].includes(assoc)) {
                          await tryComment(`⚠️ @${login} Backports can only be triggered by repository owners, organization members, or collaborators.`);
                          core.setOutput('triggered', 'false');
                          return;
                      }

                      if (bareMatch && !match) {
                          core.setOutput('triggered', 'false');
                          await tryComment('⚠️ `/backport` requires at least one target branch, e.g. `/backport v5.0.x`.');
                          return;
                      }
                      if (!match) {
                          core.setOutput('triggered', 'false');
                          return;
                      }

                      // Parse branch list (space- or comma-separated).
                      const branches = match[1].trim().split(/[\s,]+/).filter(Boolean);
                      if (branches.length === 0) {
                          // e.g. "/backport ,,," — separators only, no real branch names
                          core.setOutput('triggered', 'false');
                          await tryComment('⚠️ `/backport` requires at least one target branch, e.g. `/backport v5.0.x`.');
                          return;
                      }

                      // Validate branch names with the same allow-list used in
                      // backport.yaml so the user gets immediate feedback rather
                      // than a silent dispatch failure.
                      const validBranchRe = /^[a-zA-Z0-9][a-zA-Z0-9._\-/]*$/;
                      const invalidBranches = branches.filter(b => !validBranchRe.test(b));
                      if (invalidBranches.length > 0) {
                          core.setOutput('triggered', 'false');
                          await tryComment(`⚠️ Invalid branch name(s): ${invalidBranches.map(b => `\`${b}\``).join(', ')}. Branch names may only contain alphanumeric characters, dots, hyphens, underscores, and slashes.`);
                          return;
                      }

                      // Confirm the PR is actually merged.
                      // merged_at is present in the issue_comment webhook payload
                      // for PRs, so no extra API call is needed.
                      if (!context.payload.issue.pull_request.merged_at) {
                          await tryComment('⚠️ Cannot backport: this PR has not been merged yet.');
                          core.setOutput('triggered', 'false');
                          return;
                      }

                      // Acknowledge the command with a 👀 reaction on the triggering comment.
                      // Ignore 422 (reaction already exists) so re-runs don't fail.
                      try {
                          await github.rest.reactions.createForIssueComment({
                              owner:      context.repo.owner,
                              repo:       context.repo.repo,
                              comment_id: commentId,
                              content:    'eyes',
                          });
                      } catch (err) {
                          if (err.status !== 422) throw err;
                      }

                      core.setOutput('triggered', 'true');
                      core.setOutput('pr_number', String(issueNumber));
                      core.setOutput('branches',  branches.join(','));
                      core.notice(`Dispatching backport of PR #${issueNumber} to: ${branches.join(', ')}`);

            - name: Trigger backport workflow
              if: steps.parse.outputs.triggered == 'true'
              uses: actions/github-script@v8
              env:
                  PR_NUMBER: ${{ steps.parse.outputs.pr_number }}
                  BRANCHES: ${{ steps.parse.outputs.branches }}
              with:
                  script: |
                      // workflow_dispatch requires a ref; use the default branch.
                      const { data: repo } = await github.rest.repos.get({
                          owner: context.repo.owner,
                          repo:  context.repo.repo,
                      });

                      await github.rest.actions.createWorkflowDispatch({
                          owner:       context.repo.owner,
                          repo:        context.repo.repo,
                          workflow_id: 'backport.yaml',
                          ref:         repo.default_branch,
                          inputs: {
                              pr_number: process.env.PR_NUMBER,
                              branches:  process.env.BRANCHES,
                          },
                      });
        needs:
            - alpha_bridge_inputs
    alpha_bridge_inputs:
        name: CI input check
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        concurrency:
            group: alpha-bridge-inputs-0a6444892967d377-${{ github.workflow 
                }}-${{ github.sha }}-${{ github.event.schedule || 
                github.event_name }}
            cancel-in-progress: false
            queue: max
        outputs:
            changed: ${{ steps.identity.outputs.changed }}
        steps:
            - id: identity
              name: Check source, workflow, variables, and runner inputs
              env:
                  GH_TOKEN: ${{ github.token }}
                  AB_REPOSITORY: ${{ github.repository }}
                  AB_RUN_ID: ${{ github.run_id }}
                  AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || 
                      github.event_name == 'workflow_run') && 
                      '7dead937f0b9ca60ee1b34bc80f84a6ac623d300' || github.sha 
                      }}
                  AB_REF: ${{ (github.event_name == 'schedule' || 
                      github.event_name == 'workflow_run') && 'refs/heads/main' 
                      || github.ref }}
                  AB_WORKFLOW_DIGEST: 
                      51464c651ec98f224857517f6a444c19efe214a9625dcc30303fdeed6d9973b8
                  AB_EVENT: ${{ github.event_name }}
                  AB_SCHEDULE: ${{ github.event.schedule || '' }}
                  AB_VARIABLES: ${{ toJSON(vars) }}
                  AB_INPUTS: ${{ toJSON(inputs) }}
                  AB_DEFAULT_PERMISSIONS: read
                  AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
              shell: bash
              run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input
                  check, embedded in the owned fork configuration.\"\"\"\n\nfrom __future__
                  import annotations\n\nimport base64\nimport hashlib\nimport json\n\
                  import os\nimport re\nimport urllib.parse\nimport urllib.request\n\
                  \nINPUT_CHECK_NAMES = (\"CI input check\", \"AlphaBridge input check\"\
                  )\nINPUT_IDENTITY_PREFIXES = (\"CI input identity \", \"AlphaBridge
                  input identity \")\n\n\ndef is_input_check(job):\n    \"\"\"GitHub
                  prefixes callable job names with each caller's display name.\"\"\
                  \"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
                  INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in
                  job.get(\"steps\", []):\n        if step.get(\"conclusion\") !=
                  \"success\":\n            continue\n        name = step.get(\"name\"\
                  , \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n      \
                  \      if name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
                  \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n\
                  \                    return identity\n    return \"\"\n\n\ndef parent_has_work(get,
                  repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
                  head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"\
                  status\") != \"completed\"\n    ):\n        return True\n    sha
                  = parent[\"head_sha\"]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha)
                  is None:\n        raise ValueError(\"parent workflow has no exact
                  configuration commit\")\n    record = get(f\"/repos/{repository}\"\
                  )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
                  )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"\
                  ]))\n    if (\n        record.get(\"fork\") is not True\n      \
                  \  or marker.get(\"schema\") != \"alpha-bridge/fork-ci\"\n     \
                  \   or marker.get(\"source_repository\") != record.get(\"parent\"\
                  , {}).get(\"full_name\")\n    ):\n        raise ValueError(\"parent
                  CI configuration has no verified fork ownership\")\n    path = parent[\"\
                  path\"].split(\"@\", 1)[0]\n    if not path.startswith(\".github/workflows/\"\
                  ) or \"/\" in path.removeprefix(\".github/workflows/\"):\n     \
                  \   raise ValueError(\"parent workflow path is outside its configuration
                  owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
                  safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
                  content\"])).hexdigest() != marker.get(\n        \"definition_sha256\"\
                  , {}\n    ).get(path):\n        raise ValueError(\"parent workflow
                  differs from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
                  :\n        return False\n    jobs = []\n    page = 1\n    while
                  True:\n        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
                  \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
                  < 100:\n            break\n        page += 1\n    guards = [\n \
                  \       job\n        for job in jobs\n        if is_input_check(job)
                  and job.get(\"conclusion\") == \"success\" and input_identity(job)\n\
                  \    ]\n    return not guards or any(\n        job not in guards
                  and job.get(\"conclusion\") != \"skipped\" for job in jobs\n   \
                  \ )\n\n\ndef changed(get, *, repository, run_id, identity, job_name):\n\
                  \    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
                  )\n    event = current[\"event\"]\n    page = 1\n    while True:\n\
                  \        # Filter locally: GitHub caps filtered searches at 1,000
                  results.\n        query = urllib.parse.urlencode({\"per_page\":
                  100, \"page\": page})\n        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
                  )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"\
                  id\"] == run_id:\n                continue\n            if run.get(\"\
                  head_branch\") != current[\"head_branch\"] or run.get(\"event\"\
                  ) != event:\n                continue\n            job_page = 1\n\
                  \            while True:\n                jobs = get(\n        \
                  \            f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
                  \n                )[\"jobs\"]\n                for job in jobs:\n\
                  \                    if (\n                        (\n         \
                  \                   is_input_check(job)\n                      \
                  \      if job_name in INPUT_CHECK_NAMES\n                      \
                  \      else job[\"name\"] == job_name\n                        )\n\
                  \                        and job.get(\"status\") == \"completed\"\
                  \n                        and job.get(\"conclusion\") == \"success\"\
                  \n                        and input_identity(job) == identity\n\
                  \                    ):\n                        return False\n\
                  \                if len(jobs) < 100:\n                    break\n\
                  \                job_page += 1\n        if len(runs[\"workflow_runs\"\
                  ]) < 100:\n            return True\n        page += 1\n\n\ndef main():\n\
                  \    event = os.environ[\"AB_EVENT\"]\n    event_payload = None\n\
                  \    if event not in {\"schedule\", \"workflow_run\"}:\n       \
                  \ with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
                  ) as payload_file:\n            event_payload = json.load(payload_file)\n\
                  \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"\
                  ],\n        \"source_ref\": os.environ[\"AB_REF\"],\n        \"\
                  workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n   \
                  \     \"event\": event,\n        \"event_payload\": event_payload,\n\
                  \        \"schedule\": os.environ[\"AB_SCHEDULE\"],\n        \"\
                  variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n       \
                  \ \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
                  default_workflow_permissions\": os.environ[\"AB_DEFAULT_PERMISSIONS\"\
                  ],\n        \"runner_image\": [os.environ.get(\"ImageOS\", \"\"\
                  ), os.environ.get(\"ImageVersion\", \"\")],\n        \"producer\"\
                  : json.loads(os.environ.get(\"AB_WORKFLOW_RUN\", \"null\")),\n \
                  \   }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
                  \n    def get(path):\n        request = urllib.request.Request(\n\
                  \            \"https://api.github.com\" + path,\n            headers={\n\
                  \                \"Authorization\": \"Bearer \" + os.environ[\"\
                  GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
                  ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n \
                  \           },\n        )\n        with urllib.request.urlopen(request,
                  timeout=60) as response:\n            return json.load(response)\n\
                  \n    manual = event == \"workflow_dispatch\" or int(os.environ[\"\
                  GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual or (\n     \
                  \   (\n            inputs[\"event\"] != \"workflow_run\"\n     \
                  \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"\
                  producer\"])\n        )\n        and changed(\n            get,\n\
                  \            repository=os.environ[\"AB_REPOSITORY\"],\n       \
                  \     run_id=int(os.environ[\"AB_RUN_ID\"]),\n            identity=identity,\n\
                  \            job_name=\"CI input check\",\n        )\n    )\n  \
                  \  with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
                  ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
                  n\")\n    print(\n        \"Explicit CI run requested\"\n      \
                  \  if manual\n        else \"CI inputs changed\"\n        if should_run\n\
                  \        else \"CI inputs unchanged; build and test jobs skipped\"\
                  \n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
            - name: CI input identity ${{ steps.identity.outputs.digest }}
              run: echo 'Input identity recorded'
