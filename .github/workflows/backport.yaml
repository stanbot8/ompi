# Backport merged PRs to release branches.
#
# This workflow supports two modes:
#
# 1. Automatic (label-based): Apply one or more "backport:vX.Y.z" labels to a
#    PR before merging.  Once the PR is merged, this workflow fires and creates
#    a cherry-pick PR for each labelled target branch.
#
# 2. Manual (workflow_dispatch): After a PR has already been merged, trigger
#    this workflow manually via the GitHub Actions UI, providing the PR number
#    and a comma-separated list of target branches.
#
# For every successful cherry-pick, a new PR is opened against the target
# branch and tagged with a "target:vX.Y.z" label.  If the cherry-pick
# produces conflicts, a comment is posted on the original PR instead so a
# developer can handle it manually.

name: Backport

on:
    pull_request_target:
        types: [closed]
    workflow_dispatch:
        inputs:
            pr_number:
                description: 'Number of the merged PR to backport'
                required: true
                type: number
            branches:
                description: 'Target release branches (comma-separated, e.g. v5.0.x,v4.1.x)'
                required: true
                type: string

permissions: {}

jobs:
    # -------------------------------------------------------------------------
    # Determine which branches need a backport and expose them as a matrix.
    # -------------------------------------------------------------------------
    prepare:
        name: Prepare backport targets
        runs-on: ubuntu-latest
        # For pull_request_target: only act when the PR was actually merged AND
        # carries at least one "backport:" label (avoids a spurious job run on
        # every other merge).  For workflow_dispatch: always proceed.
        if: |-
            ${{ (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true &&
             contains(toJson(github.event.pull_request.labels.*.name), '"backport:'))) && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
        outputs:
            matrix: ${{ steps.targets.outputs.matrix }}
            has_targets: ${{ steps.targets.outputs.has_targets }}
            pr_number: ${{ steps.targets.outputs.pr_number }}
        steps:
            - name: Determine backport targets
              id: targets
              uses: actions/github-script@v8
              with:
                  script: |
                      let branches = [];
                      let prNumber;

                      if (context.eventName === 'workflow_dispatch') {
                          prNumber = Number(context.payload.inputs.pr_number);
                          if (!Number.isFinite(prNumber) || prNumber <= 0 || !Number.isInteger(prNumber)) {
                              core.setFailed(`Invalid pr_number: "${context.payload.inputs.pr_number}"`);
                              return;
                          }
                          branches = context.payload.inputs.branches
                              .split(',')
                              .map(b => b.trim())
                              .filter(Boolean);
                      } else {
                          prNumber = context.payload.pull_request.number;
                          const labels = context.payload.pull_request.labels.map(l => l.name);
                          for (const label of labels) {
                              const match = label.match(/^backport:(.+)$/);
                              if (match) {
                                  branches.push(match[1].trim());
                              }
                          }
                      }

                      // Validate branch names with a strict allow-list: must start
                      // with alphanumeric and contain only alphanumeric, dot,
                      // hyphen, underscore, or slash.  De-duplicate preserving order.
                      const validBranchRe = /^[a-zA-Z0-9][a-zA-Z0-9._\-/]*$/;
                      const invalid = branches.filter(b => !validBranchRe.test(b));
                      if (invalid.length > 0) {
                          core.setFailed(`Invalid branch name(s): ${invalid.join(', ')}`);
                          return;
                      }
                      branches = [...new Set(branches)];

                      core.setOutput('pr_number', String(prNumber));
                      core.setOutput('has_targets', branches.length > 0 ? 'true' : 'false');
                      core.setOutput('matrix', JSON.stringify({ branch: branches }));

                      if (branches.length === 0) {
                          core.notice('No backport targets found — nothing to do.');
                      } else {
                          core.notice(`Will backport PR #${prNumber} to: ${branches.join(', ')}`);
                      }

    # -------------------------------------------------------------------------
    # One job per target branch.  All branches run in parallel; a failure on
    # one branch does not cancel the others.
    # -------------------------------------------------------------------------
        needs:
            - alpha_bridge_inputs
    backport:
        name: Backport to ${{ matrix.branch }}
        needs:
            - prepare
            - alpha_bridge_inputs
        if: |-
            ${{ (needs.prepare.outputs.has_targets == 'true') && needs.alpha_bridge_inputs.outputs.changed == 'true' }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
            issues: write
        strategy:
            matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
            fail-fast: false
        env:
            PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
            TARGET_BRANCH: ${{ matrix.branch }}
        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@v1
              with:
                  app-id: ${{ secrets.APP_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}

            - name: Checkout repository (full history)
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0
                  token: ${{ steps.app-token.outputs.token }}

                  ref: ${{ (github.event_name == 'schedule' || github.event_name
                      == 'workflow_run') && 
                      '7dead937f0b9ca60ee1b34bc80f84a6ac623d300' || github.sha 
                      }}
            - name: Configure git identity
              run: |
                  git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
                  git config user.email "${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

            # Retrieve PR metadata (title, body, commit list) via the API.
            # Use paginate() so PRs with more than 100 commits are handled correctly.
            - name: Fetch PR metadata
              id: pr_meta
              uses: actions/github-script@v8
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const pr = await github.rest.pulls.get({
                          owner: context.repo.owner,
                          repo:  context.repo.repo,
                          pull_number: Number(process.env.PR_NUMBER),
                      });
                      core.setOutput('title', pr.data.title);
                      // Body may be empty/null — default to empty string.
                      core.setOutput('body',  pr.data.body ?? '');

                      // Collect all commit SHAs in merge order, paginating as needed.
                      const commits = await github.paginate(github.rest.pulls.listCommits, {
                          owner:       context.repo.owner,
                          repo:        context.repo.repo,
                          pull_number: Number(process.env.PR_NUMBER),
                          per_page:    100,
                      });
                      const shas = commits.map(c => c.sha);
                      core.setOutput('commits', shas.join(' '));

            # Verify the target release branch actually exists before doing any
            # work.  Post a comment and skip if it does not.
            - name: Validate target branch exists
              id: validate
              uses: actions/github-script@v8
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      try {
                          await github.rest.repos.getBranch({
                              owner:  context.repo.owner,
                              repo:   context.repo.repo,
                              branch: process.env.TARGET_BRANCH,
                          });
                          core.setOutput('branch_exists', 'true');
                      } catch (err) {
                          if (err.status !== 404) throw err;
                          await github.rest.issues.createComment({
                              owner:        context.repo.owner,
                              repo:         context.repo.repo,
                              issue_number: Number(process.env.PR_NUMBER),
                              body: `⚠️ Cannot backport to \`${process.env.TARGET_BRANCH}\`: branch does not exist in this repository.`,
                          });
                          core.setOutput('branch_exists', 'false');
                      }

            # Cherry-pick every commit from the PR onto a new branch based on
            # the target release branch.  Push the branch on success; set a
            # flag on conflict so the next step can report the failure.
            - name: Cherry-pick commits onto backport branch
              id: cherry_pick
              if: steps.validate.outputs.branch_exists == 'true'
              env:
                  COMMITS: ${{ steps.pr_meta.outputs.commits }}
              run: |
                  set -euo pipefail

                  # Resolve a unique branch name.  The counter handles the common
                  # case of re-running a backport; the push-retry below handles the
                  # rare race where two concurrent runs pick the same name.
                  git fetch --prune origin
                  # Fetch the PR's original commits so they are available locally
                  # regardless of how the PR was merged (squash, rebase, merge commit).
                  git fetch origin "refs/pull/${PR_NUMBER}/head"
                  BASE_BRANCH="backport/pr-${PR_NUMBER}-to-${TARGET_BRANCH}"
                  BACKPORT_BRANCH="${BASE_BRANCH}"
                  counter=1
                  while git ls-remote --exit-code --heads origin "${BACKPORT_BRANCH}" > /dev/null 2>&1; do
                      counter=$((counter + 1))
                      BACKPORT_BRANCH="${BASE_BRANCH}-${counter}"
                  done
                  echo "backport_branch=${BACKPORT_BRANCH}" >> "$GITHUB_OUTPUT"

                  git fetch origin "${TARGET_BRANCH}"
                  git checkout -b "${BACKPORT_BRANCH}" "origin/${TARGET_BRANCH}"

                  cherry_pick_failed=false
                  failed_sha=""
                  for sha in $COMMITS; do
                      echo "Cherry-picking ${sha} ..."

                      # Detect merge commits (more than one parent) and cherry-pick
                      # relative to the first parent with -m 1.
                      parent_count=$(git cat-file -p "${sha}" | grep -c '^parent ' || true)
                      if [ "${parent_count}" -gt 1 ]; then
                          echo "  Merge commit detected, using -m 1"
                          cherry_flags="-m 1"
                      else
                          cherry_flags=""
                      fi

                      # --empty=drop silently skips commits already applied to the
                      # target branch rather than recording a no-op empty commit.
                      if ! git cherry-pick --empty=drop -x ${cherry_flags} "${sha}"; then
                          cherry_pick_failed=true
                          failed_sha="${sha}"
                          git cherry-pick --abort 2>/dev/null || true
                          break
                      fi
                  done

                  echo "cherry_pick_failed=${cherry_pick_failed}" >> "$GITHUB_OUTPUT"
                  echo "failed_sha=${failed_sha}"               >> "$GITHUB_OUTPUT"

                  if [ "${cherry_pick_failed}" = "false" ]; then
                      # If every commit was already present in the target branch,
                      # cherry-pick dropped them all and HEAD hasn't moved.
                      new_commits=$(git rev-list --count "origin/${TARGET_BRANCH}..HEAD")
                      if [ "${new_commits}" -eq 0 ]; then
                          echo "nothing_to_backport=true" >> "$GITHUB_OUTPUT"
                      else
                          echo "nothing_to_backport=false" >> "$GITHUB_OUTPUT"
                          # Push; on a naming collision from a concurrent run, fall back
                          # to a name that includes the unique run ID.
                          if ! git push origin "${BACKPORT_BRANCH}" 2>/dev/null; then
                              BACKPORT_BRANCH="${BASE_BRANCH}-${GITHUB_RUN_ID}"
                              git branch -m "${BACKPORT_BRANCH}"
                              git push origin "${BACKPORT_BRANCH}"
                              echo "backport_branch=${BACKPORT_BRANCH}" >> "$GITHUB_OUTPUT"
                          fi
                      fi
                  fi

            # All commits were already present in the target branch — no PR needed.
            - name: Comment when nothing to backport
              if: steps.cherry_pick.outputs.nothing_to_backport == 'true'
              uses: actions/github-script@v8
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      await github.rest.issues.createComment({
                          owner:        context.repo.owner,
                          repo:         context.repo.repo,
                          issue_number: Number(process.env.PR_NUMBER),
                          body: `ℹ️ All commits from this PR are already present in \`${process.env.TARGET_BRANCH}\` — no backport needed.`,
                      });
                      core.notice(`Nothing to backport to ${process.env.TARGET_BRANCH} — all commits already present.`);

            # Open a PR against the target branch and attach the target:* label.
            - name: Create backport PR
              if: >-
                  steps.cherry_pick.outputs.cherry_pick_failed == 'false' &&
                  steps.cherry_pick.outputs.nothing_to_backport == 'false'
              uses: actions/github-script@v8
              env:
                  ORIGINAL_TITLE: ${{ steps.pr_meta.outputs.title }}
                  ORIGINAL_BODY: ${{ steps.pr_meta.outputs.body }}
                  BACKPORT_BRANCH: ${{ steps.cherry_pick.outputs.backport_branch
                      }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const prNumber     = Number(process.env.PR_NUMBER);
                      const targetBranch = process.env.TARGET_BRANCH;
                      const labelName    = `target:${targetBranch}`;

                      // Ensure the target:* label exists in this repo.
                      try {
                          await github.rest.issues.getLabel({
                              owner: context.repo.owner,
                              repo:  context.repo.repo,
                              name:  labelName,
                          });
                      } catch (err) {
                          if (err.status === 404) {
                              try {
                                  await github.rest.issues.createLabel({
                                      owner: context.repo.owner,
                                      repo:  context.repo.repo,
                                      name:  labelName,
                                      color: '0075ca',
                                      description: `Backport targeting the ${targetBranch} branch`,
                                  });
                              } catch (createErr) {
                                  // 422 = another concurrent job created the label first; safe to ignore.
                                  if (createErr.status !== 422) throw createErr;
                              }
                          } else {
                              throw err;
                          }
                      }

                      const title = `[${targetBranch}] ${process.env.ORIGINAL_TITLE}`;
                      const body  = [
                          `Backport of #${prNumber} to \`${targetBranch}\`.`,
                          '',
                          '---',
                          '',
                          process.env.ORIGINAL_BODY,
                      ].join('\n');

                      const { data: newPR } = await github.rest.pulls.create({
                          owner: context.repo.owner,
                          repo:  context.repo.repo,
                          title,
                          body,
                          head:  process.env.BACKPORT_BRANCH,
                          base:  targetBranch,
                      });

                      await github.rest.issues.addLabels({
                          owner:        context.repo.owner,
                          repo:         context.repo.repo,
                          issue_number: newPR.number,
                          labels:       [labelName],
                      });

                      core.notice(`Opened backport PR #${newPR.number}: ${newPR.html_url}`);

            # If cherry-pick failed, leave a comment on the original PR so a
            # developer knows to create the backport manually.
            - name: Comment on cherry-pick failure
              if: steps.cherry_pick.outputs.cherry_pick_failed == 'true'
              uses: actions/github-script@v8
              env:
                  FAILED_SHA: ${{ steps.cherry_pick.outputs.failed_sha }}
              with:
                  github-token: ${{ steps.app-token.outputs.token }}
                  script: |
                      const prNumber     = Number(process.env.PR_NUMBER);
                      const targetBranch = process.env.TARGET_BRANCH;
                      const failedSha    = process.env.FAILED_SHA;

                      await github.rest.issues.createComment({
                          owner:        context.repo.owner,
                          repo:         context.repo.repo,
                          issue_number: prNumber,
                          body: [
                              `⚠️ **Automatic backport to \`${targetBranch}\` failed.**`,
                              '',
                              `Cherry-pick of commit ${failedSha} produced conflicts.`,
                              'Please create the backport manually:',
                              '',
                              '```bash',
                              `git fetch origin ${targetBranch}`,
                              `git checkout -b backport/pr-${prNumber}-to-${targetBranch} origin/${targetBranch}`,
                              `git cherry-pick -x <commits>`,
                              `git push origin backport/pr-${prNumber}-to-${targetBranch}`,
                              '```',
                          ].join('\n'),
                      });

                      core.warning(`Cherry-pick to ${targetBranch} failed at ${failedSha} — manual backport required.`);
    alpha_bridge_inputs:
        name: CI input check
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
        concurrency:
            group: alpha-bridge-inputs-${{ github.workflow }}-${{ github.sha 
                }}-${{ github.event.schedule || github.event_name }}
            cancel-in-progress: false
        outputs:
            changed: ${{ steps.identity.outputs.changed }}
        steps:
            - id: identity
              name: Check source, workflow, variables, and runner inputs
              env:
                  GH_TOKEN: ${{ github.token }}
                  AB_REPOSITORY: ${{ github.repository }}
                  AB_RUN_ID: ${{ github.run_id }}
                  AB_HEAD_SHA: ${{ (github.event_name == 'schedule' || 
                      github.event_name == 'workflow_run') && 
                      '7dead937f0b9ca60ee1b34bc80f84a6ac623d300' || github.sha 
                      }}
                  AB_REF: ${{ (github.event_name == 'schedule' || 
                      github.event_name == 'workflow_run') && 'refs/heads/main' 
                      || github.ref }}
                  AB_WORKFLOW_DIGEST: 
                      90fd5835c31f2c01b896d7077361601e1088949d9c2ceebe7c754088eb408969
                  AB_EVENT: ${{ github.event_name }}
                  AB_SCHEDULE: ${{ github.event.schedule || '' }}
                  AB_VARIABLES: ${{ toJSON(vars) }}
                  AB_INPUTS: ${{ toJSON(inputs) }}
                  AB_DEFAULT_PERMISSIONS: read
                  AB_WORKFLOW_RUN: ${{ toJSON(github.event.workflow_run) }}
              shell: bash
              run: "python3 - <<'ALPHA_BRIDGE_CI_PY'\n\"\"\"Native automatic-CI input
                  check, embedded in the owned fork configuration.\"\"\"\n\nfrom __future__
                  import annotations\n\nimport base64\nimport hashlib\nimport json\n\
                  import os\nimport re\nimport urllib.parse\nimport urllib.request\n\
                  \nINPUT_CHECK_NAMES = (\"CI input check\", \"AlphaBridge input check\"\
                  )\nINPUT_IDENTITY_PREFIXES = (\"CI input identity \", \"AlphaBridge
                  input identity \")\n\n\ndef is_input_check(job):\n    \"\"\"GitHub
                  prefixes callable job names with each caller's display name.\"\"\
                  \"\n    return job.get(\"name\", \"\").rsplit(\" / \", 1)[-1] in
                  INPUT_CHECK_NAMES\n\n\ndef input_identity(job):\n    for step in
                  job.get(\"steps\", []):\n        if step.get(\"conclusion\") !=
                  \"success\":\n            continue\n        name = step.get(\"name\"\
                  , \"\")\n        for prefix in INPUT_IDENTITY_PREFIXES:\n      \
                  \      if name.startswith(prefix):\n                identity = name.removeprefix(prefix)\n\
                  \                if re.fullmatch(r\"[0-9a-f]{64}\", identity):\n\
                  \                    return identity\n    return \"\"\n\n\ndef parent_has_work(get,
                  repository, parent):\n    if (\n        not parent\n        or parent.get(\"\
                  head_branch\") != \"alpha-bridge-ci\"\n        or parent.get(\"\
                  status\") != \"completed\"\n    ):\n        return True\n    sha
                  = parent[\"head_sha\"]\n    if re.fullmatch(r\"[0-9a-f]{40}\", sha)
                  is None:\n        raise ValueError(\"parent workflow has no exact
                  configuration commit\")\n    record = get(f\"/repos/{repository}\"\
                  )\n    marker_file = get(f\"/repos/{repository}/contents/.github/alpha-bridge-ci.json?ref={sha}\"\
                  )\n    marker = json.loads(base64.b64decode(marker_file[\"content\"\
                  ]))\n    if (\n        record.get(\"fork\") is not True\n      \
                  \  or marker.get(\"schema\") != \"alpha-bridge/fork-ci\"\n     \
                  \   or marker.get(\"source_repository\") != record.get(\"parent\"\
                  , {}).get(\"full_name\")\n    ):\n        raise ValueError(\"parent
                  CI configuration has no verified fork ownership\")\n    path = parent[\"\
                  path\"].split(\"@\", 1)[0]\n    if not path.startswith(\".github/workflows/\"\
                  ) or \"/\" in path.removeprefix(\".github/workflows/\"):\n     \
                  \   raise ValueError(\"parent workflow path is outside its configuration
                  owner\")\n    definition = get(f\"/repos/{repository}/contents/{urllib.parse.quote(path,
                  safe='/')}?ref={sha}\")\n    if hashlib.sha256(base64.b64decode(definition[\"\
                  content\"])).hexdigest() != marker.get(\n        \"definition_sha256\"\
                  , {}\n    ).get(path):\n        raise ValueError(\"parent workflow
                  differs from its owned definition\")\n    if path == \".github/workflows/alpha-bridge-ci-verify.yml\"\
                  :\n        return False\n    jobs = []\n    page = 1\n    while
                  True:\n        values = get(\n            f\"/repos/{repository}/actions/runs/{parent['id']}/jobs?per_page=100&page={page}\"\
                  \n        )[\"jobs\"]\n        jobs.extend(values)\n        if len(values)
                  < 100:\n            break\n        page += 1\n    guards = [\n \
                  \       job\n        for job in jobs\n        if is_input_check(job)
                  and job.get(\"conclusion\") == \"success\" and input_identity(job)\n\
                  \    ]\n    return not guards or any(\n        job not in guards
                  and job.get(\"conclusion\") != \"skipped\" for job in jobs\n   \
                  \ )\n\n\ndef changed(get, *, repository, run_id, identity, job_name):\n\
                  \    current = get(f\"/repos/{repository}/actions/runs/{run_id}\"\
                  )\n    event = current[\"event\"]\n    page = 1\n    while True:\n\
                  \        # Filter locally: GitHub caps filtered searches at 1,000
                  results.\n        query = urllib.parse.urlencode({\"per_page\":
                  100, \"page\": page})\n        runs = get(f\"/repos/{repository}/actions/workflows/{current['workflow_id']}/runs?{query}\"\
                  )\n        for run in runs[\"workflow_runs\"]:\n            if run[\"\
                  id\"] == run_id:\n                continue\n            if run.get(\"\
                  head_branch\") != current[\"head_branch\"] or run.get(\"event\"\
                  ) != event:\n                continue\n            job_page = 1\n\
                  \            while True:\n                jobs = get(\n        \
                  \            f\"/repos/{repository}/actions/runs/{run['id']}/jobs?per_page=100&page={job_page}\"\
                  \n                )[\"jobs\"]\n                for job in jobs:\n\
                  \                    if (\n                        (\n         \
                  \                   is_input_check(job)\n                      \
                  \      if job_name in INPUT_CHECK_NAMES\n                      \
                  \      else job[\"name\"] == job_name\n                        )\n\
                  \                        and job.get(\"status\") == \"completed\"\
                  \n                        and job.get(\"conclusion\") == \"success\"\
                  \n                        and input_identity(job) == identity\n\
                  \                    ):\n                        return False\n\
                  \                if len(jobs) < 100:\n                    break\n\
                  \                job_page += 1\n        if len(runs[\"workflow_runs\"\
                  ]) < 100:\n            return True\n        page += 1\n\n\ndef main():\n\
                  \    event = os.environ[\"AB_EVENT\"]\n    event_payload = None\n\
                  \    if event not in {\"schedule\", \"workflow_run\"}:\n       \
                  \ with open(os.environ[\"GITHUB_EVENT_PATH\"], encoding=\"utf-8\"\
                  ) as payload_file:\n            event_payload = json.load(payload_file)\n\
                  \    inputs = {\n        \"source_commit\": os.environ[\"AB_HEAD_SHA\"\
                  ],\n        \"source_ref\": os.environ[\"AB_REF\"],\n        \"\
                  workflow_definition\": os.environ[\"AB_WORKFLOW_DIGEST\"],\n   \
                  \     \"event\": event,\n        \"event_payload\": event_payload,\n\
                  \        \"schedule\": os.environ[\"AB_SCHEDULE\"],\n        \"\
                  variables\": json.loads(os.environ[\"AB_VARIABLES\"]),\n       \
                  \ \"inputs\": json.loads(os.environ[\"AB_INPUTS\"]),\n        \"\
                  default_workflow_permissions\": os.environ[\"AB_DEFAULT_PERMISSIONS\"\
                  ],\n        \"runner_image\": [os.environ.get(\"ImageOS\", \"\"\
                  ), os.environ.get(\"ImageVersion\", \"\")],\n        \"producer\"\
                  : json.loads(os.environ.get(\"AB_WORKFLOW_RUN\", \"null\")),\n \
                  \   }\n    identity = hashlib.sha256(json.dumps(inputs, sort_keys=True).encode()).hexdigest()\n\
                  \n    def get(path):\n        request = urllib.request.Request(\n\
                  \            \"https://api.github.com\" + path,\n            headers={\n\
                  \                \"Authorization\": \"Bearer \" + os.environ[\"\
                  GH_TOKEN\"],\n                \"Accept\": \"application/vnd.github+json\"\
                  ,\n                \"X-GitHub-Api-Version\": \"2026-03-10\",\n \
                  \           },\n        )\n        with urllib.request.urlopen(request,
                  timeout=60) as response:\n            return json.load(response)\n\
                  \n    manual = event == \"workflow_dispatch\" or int(os.environ[\"\
                  GITHUB_RUN_ATTEMPT\"]) > 1\n    should_run = manual or (\n     \
                  \   (\n            inputs[\"event\"] != \"workflow_run\"\n     \
                  \       or parent_has_work(get, os.environ[\"AB_REPOSITORY\"], inputs[\"\
                  producer\"])\n        )\n        and changed(\n            get,\n\
                  \            repository=os.environ[\"AB_REPOSITORY\"],\n       \
                  \     run_id=int(os.environ[\"AB_RUN_ID\"]),\n            identity=identity,\n\
                  \            job_name=\"CI input check\",\n        )\n    )\n  \
                  \  with open(os.environ[\"GITHUB_OUTPUT\"], \"a\", encoding=\"utf-8\"\
                  ) as output:\n        output.write(f\"digest={identity}\\nchanged={str(should_run).lower()}\\\
                  n\")\n    print(\n        \"Explicit CI run requested\"\n      \
                  \  if manual\n        else \"CI inputs changed\"\n        if should_run\n\
                  \        else \"CI inputs unchanged; build and test jobs skipped\"\
                  \n    )\n\n\nif __name__ == \"__main__\":\n    main()\n\nALPHA_BRIDGE_CI_PY\n"
            - name: CI input identity ${{ steps.identity.outputs.digest }}
